upstream django {
    server web:8000;
}

upstream minio {
    server minio:9000;
}

server {
    listen 80;
    server_name _;   # _ means "catch all hostnames" — fine for dev/single domain

    # Logging
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # Security: don't expose nginx version in error pages and headers
    server_tokens off;

    # Global upload size limit — applies to all locations unless overridden
    client_max_body_size 10M;

    # ── Location 1: Django static files ──────────────────────────────────────
    # ^~ means: if this prefix matches, stop looking at regex rules below.
    # alias serves files directly from the shared Docker volume.
    # nginx never touches Django for these requests.
    location ^~ /static/ {
        alias /usr/src/web/staticfiles/;

        # Tell browsers to cache static files for 30 days.
        # "immutable" means "don't even revalidate" — safe because
        # Django's collectstatic hashes filenames (main.abc123.css),
        # so a changed file always gets a new URL.
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── Location 2: MinIO object storage (presigned URLs) ────────────────────
    # Clients use pre-signed URLs like:
    #   /minio/my-bucket/images/photo.jpg?AWSAccessKeyId=...&Signature=...
    #
    # proxy_pass with trailing slash STRIPS the /minio/ prefix before
    # forwarding — MinIO receives /my-bucket/images/photo.jpg which is
    # exactly what its S3 API expects.
    #
    # Direct GET /minio/ returns a 307 from MinIO — that's expected and
    # harmless. Nobody should hit /minio/ without a bucket and key.
    location ^~ /minio/ {
        proxy_pass              http://minio/;   # trailing slash strips /minio/
        proxy_set_header        Host               $http_host;
        proxy_set_header        X-Real-IP          $remote_addr;
        proxy_set_header        X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto  $scheme;

        # Disable buffering for file uploads/downloads.
        # Without this, nginx buffers the entire file in memory/disk
        # before sending it — slow and memory-intensive for large files.
        proxy_buffering         off;
        proxy_request_buffering off;

        # Override the global 10M limit for file storage
        client_max_body_size 100M;
    }

    # ── Location 3: Django application (catch-all) ────────────────────────────
    # Everything that didn't match /static/ or /minio/ lands here.
    # No trailing slash on proxy_pass → full path forwarded as-is.
    location / {
        proxy_pass         http://django;
        proxy_redirect     off;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
    }
}